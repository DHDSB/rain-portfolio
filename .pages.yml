media:
  input: public/images
  output: /images

content:
  - name: content
    label: 网站内容
    type: collection
    path: src/content
    format: yaml-frontmatter
    filename: "{fields.id}.md"

    view:
      fields:
        - title
        - category
        - date
      primary: title
      sort:
        - date
        - title

    fields:
      - name: id
        label: 唯一 ID
        type: string
        required: true

      - name: title
        label: 标题
        type: string
        required: true

      - name: category
        label: 分类
        type: select
        required: true
        options:
          values:
            - 作品
            - 文章
            - 记录

      - name: date
        label: 日期
        type: date
        required: true

      - name: featured
        label: 首页精选
        type: boolean

      - name: cover
        label: 封面图片
        type: image
        required: false
        options:
          path: public/images
          extensions:
            - jpg
            - jpeg
            - png
            - webp
          rename: true
          
      - name: description
        label: 摘要
        type: text
        required: true

      - name: tags
        label: 标签
        type: string
        list: true

      - name: body
        label: 正文
        type: rich-text