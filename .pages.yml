media:
  input: public/images
  output: /images

content:
  - name: content
    label: 网站内容
    type: collection
    path: src/content
    format: yaml-frontmatter
    filename: "{fields.id}.md"

    view:
      fields:
        - title
        - category
        - date
      primary: title
      sort:
        - date
        - title

    fields:
      - name: id
        label: 唯一 ID
        type: string
        required: true

      - name: title
        label: 标题
        type: string
        required: true

      - name: category
        label: 分类
        type: select
        required: true
        options:
          values:
            - 作品
            - 文章
            - 记录

      - name: date
        label: 日期
        type: date
        required: true

      - name: featured
        label: 首页精选
        type: boolean

      - name: published
        label: 是否发布
        type: boolean
        default: true

      - name: cover
        label: 封面图片
        type: image
        required: false
        options:
          path: public/images/covers
          extensions:
            - jpg
            - jpeg
            - png
            - webp
          rename: true

      - name: description
        label: 摘要
        type: text
        required: true

      - name: tags
        label: 标签
        type: string
        list: true

      - name: body
        label: 正文
        type: rich-text
  - name: site-content
    label: 网站页面文案
    type: file
    path: src/data/siteContent.json
    format: json

    fields:
      - name: hero
        label: 首页主区域
        type: object
        fields:
          - name: eyebrow
            label: 顶部标签
            type: string

          - name: titleLine1
            label: 标题第一行
            type: string

          - name: titleLine2
            label: 标题第二行
            type: string

          - name: description
            label: 首页简介
            type: text

          - name: primaryButton
            label: 主按钮文字
            type: string

          - name: secondaryButton
            label: 次按钮文字
            type: string

      - name: about
        label: 关于区域
        type: object
        fields:
          - name: eyebrow
            label: 英文标签
            type: string

          - name: title
            label: 标题
            type: string

          - name: paragraphs
            label: 段落
            type: text
            list: true

      - name: contact
        label: 联系区域
        type: object
        fields:
          - name: eyebrow
            label: 英文标签
            type: string

          - name: title
            label: 标题
            type: string